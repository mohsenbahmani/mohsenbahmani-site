<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mohsen Bahmani</title>
  <script>
    // GitHub Pages serves this file for deep links such as /partnership.php.
    // Forward the requested path to the app at the site's root. If a custom
    // domain is added later, its root deployment continues to use '/'.
    var projectBase = '/mohsenbahmani-site/';
    var isProjectSite = location.pathname.startsWith(projectBase);
    var base = isProjectSite ? projectBase : '/';
    var requestedPath = isProjectSite
      ? location.pathname.slice(projectBase.length - 1)
      : location.pathname;
    location.replace(base + '?path=' + encodeURIComponent(requestedPath));
  </script>
</head>
<body></body>
</html>
